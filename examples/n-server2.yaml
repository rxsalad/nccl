apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          roce-net-fabric0@fabric0,
          roce-net-fabric2@fabric2,
          roce-net-fabric4@fabric4,
          roce-net-fabric6@fabric6,
          roce-net-fabric8@fabric8,
          roce-net-fabric10@fabric10,
          roce-net-fabric12@fabric12,
          roce-net-fabric14@fabric14
    spec:
      restartPolicy: Always

      nodeSelector:
        doks.digitalocean.com/gpu-brand: nvidia

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      volumes:
        - name: temp-hf-cache
          hostPath:
            path: /root/.cache/huggingface
            type: DirectoryOrCreate

        - name: dshm 
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi

      containers:

        - name: server
          #image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
          image: vllm/vllm-openai:cu130-nightly
          #image: vllm/vllm-openai:cu129-nightly
          #image: lmsysorg/sglang:dev-cu13
          #image: lmsysorg/sglang:dev-cu12
          
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http-example

          command: ["/bin/bash", "-lc"]
          args:
            - |
             set -ex
          
             apt update
             apt install -y iproute2 iputils-ping infiniband-diags ibverbs-utils net-tools gdb

             # Device-side debugger (cuda-gdb) + nvdisasm (pulled in as a dependency, needed by cuobjdump -sass)
             curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/cuda-gdb-13-0_13.0.85-1_amd64.deb
             dpkg -i cuda-gdb-13-0_13.0.85-1_amd64.deb || true
             apt-get install -f -y -qq
             rm -f cuda-gdb-13-0_13.0.85-1_amd64.deb
             

             # Install the VS Code CLI, which is used to create a secure tunnel between the local and the remote.
             curl -Lk 'https://code.visualstudio.com/sha/download?build=stable&os=cli-alpine-x64' -o vscode_cli.tar.gz && \
               tar -xf vscode_cli.tar.gz && \
               mv code /usr/local/bin/code && \
               rm vscode_cli.tar.gz

             # Authenticate the tunnel with your GitHub account using the provided sign-in URL.
             # code tunnel user login --provider github

             # Start the VS Code tunnel (ID: 001) in the background
             # nohup code tunnel --accept-server-license-terms --name 001 &> output.log &
             # nohup code tunnel --accept-server-license-terms --name 002 &> output.log &
             exec sleep infinity 
 
          securityContext:

            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE

          volumeMounts:
            - name: temp-hf-cache
              mountPath: /root/.cache/huggingface

            - name: dshm
              mountPath: /dev/shm

          resources:
            limits:
              nvidia.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric2: 10
              rdma/fabric4: 10
              rdma/fabric6: 10
              rdma/fabric8: 10
              rdma/fabric10: 10
              rdma/fabric12: 10
              rdma/fabric14: 10
            requests:
              nvidia.com/gpu: "8"
              rdma/fabric0: 10
              rdma/fabric2: 10
              rdma/fabric4: 10
              rdma/fabric6: 10
              rdma/fabric8: 10
              rdma/fabric10: 10
              rdma/fabric12: 10
              rdma/fabric14: 10
